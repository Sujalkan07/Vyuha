<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar(activeNav)" class="navbar">
    <div class="navbar-left">
        <a th:href="${#authorization.expression('hasRole(''FIELD_STAFF'')')} ? @{/field} : @{/events}"
           class="navbar-brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <path d="M14 17.5h7M17.5 14v7"/>
            </svg>
            <span>VYUHA</span>
        </a>

        <nav class="navbar-links" aria-label="Primary navigation" sec:authorize="isAuthenticated()">
            <a th:href="@{/events}"
               sec:authorize="hasAnyRole('ADMIN', 'ORGANIZER', 'SAFETY_REVIEWER')"
               class="navbar-link"
               th:classappend="${activeNav == 'events'} ? ' active' : ''">Events</a>

            <a th:href="@{/guidelines}"
               class="navbar-link"
               th:classappend="${activeNav == 'guidelines'} ? ' active' : ''">Safety Guidelines</a>

            <a th:href="@{/admin/users}"
               sec:authorize="hasRole('ADMIN')"
               class="navbar-link"
               th:classappend="${activeNav == 'users'} ? ' active' : ''">Users</a>
        </nav>
    </div>

    <div class="navbar-right" sec:authorize="isAuthenticated()">
        <span class="role-pill" sec:authentication="principal.roleDisplayName">Role</span>
        <span class="navbar-username" sec:authentication="principal.fullName">User Name</span>
        <form th:action="@{/logout}" method="post" class="navbar-signout-form">
            <button type="submit" class="btn-nav-signout">Sign Out</button>
        </form>
    </div>
</header>
</body>
</html>
