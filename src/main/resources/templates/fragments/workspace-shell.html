<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle != null ? pageTitle + ' — Vyuha' : 'Vyuha Workspace'}">Vyuha Workspace</title>
    <link rel="stylesheet" th:href="@{/css/vyuha-tokens.css}">
    <link rel="stylesheet" th:href="@{/css/vyuha-base.css}">
    <link rel="stylesheet" th:href="@{/css/vyuha-workspace.css}">
    <link rel="stylesheet" th:href="@{/css/vyuha-print.css}">
</head>

<body class="workspace-page"
      th:fragment="workspace(pageTitle, activeNav, eventId, activeTab, workspaceBar, toolRail, canvasArea, inspectorBody, statusStrip)">
    <div th:replace="~{fragments/navbar :: navbar(${activeNav})}"></div>
    <div th:replace="~{fragments/safety-banner :: safetyBanner}"></div>
    <div th:replace="~{fragments/event-tabs :: eventTabs(${eventId}, ${activeTab})}"></div>

    <div class="workspace-shell">
        <div class="workspace-bar" th:insert="${workspaceBar}"></div>
        <div class="workspace-body">
            <aside class="tool-rail" th:insert="${toolRail}"></aside>
            <section class="canvas-viewport" th:insert="${canvasArea}"></section>
            <aside class="inspector-panel" th:insert="${inspectorBody}"></aside>
        </div>
        <footer class="workspace-status" th:insert="${statusStrip}"></footer>
    </div>

    <th:block th:if="${eventId != null}"
              th:insert="~{fragments/assistant-drawer :: assistantDrawer(${eventId})}"></th:block>
</body>
</html>
