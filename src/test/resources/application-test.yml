spring:
  datasource:
    url: jdbc:h2:mem:vyuha_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

vyuha:
  storage:
    upload-dir: ./target/test-uploads
  seed:
    campus-festival-enabled: false
